<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MatchFlow - v12.9.1 (Duplicate Player Prevention)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: #f8fafc; color: #0f172a; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    .app { max-width: 28rem; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .sticky { position: sticky; top: 0; z-index: 50; background: #0f172a; }
    .header { padding: 1.25rem 1.25rem 1rem; border-bottom: 4px solid #f97316; }
    .brand { color: #fff; text-align: center; font-size: 1.55rem; font-weight: 900; font-style: italic; text-transform: uppercase; margin-bottom: 1rem; }
    .brand span { color: #f97316; }

    .court-bar {
      display: flex; gap: 0.4rem; padding: 0.55rem 0.75rem;
      background: #111827; border-bottom: 1px solid #334155; overflow-x: auto;
    }
    .court-pill {
      border: none; background: #1e293b; color: #cbd5e1; border-radius: 999px;
      padding: 0.8rem 1rem; font-size: 0.72rem; font-weight: 900; letter-spacing: 0.04em;
      text-transform: uppercase; white-space: nowrap; cursor: pointer;
    }
    .court-pill.active { background: #f97316; color: #fff; }
    .court-pill.add {
      background: #0f172a; border: 2px dashed #475569; color: #fff; min-width: 44px;
    }

    .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #e2e8f0; }
    .tab-btn {
      flex: 1; border: none; background: transparent; padding: 1rem; cursor: pointer;
      font-size: 0.76rem; font-weight: 900; color: #94a3b8; letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .tab-btn.active { color: #f97316; border-bottom: 4px solid #f97316; }

    main { flex: 1; padding: 1rem 1.25rem 1.5rem; }

    .card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 1.35rem;
      padding: 1rem; margin-bottom: 0.9rem;
    }
    .card.live {
      border: 2px solid #f97316;
      box-shadow: 0 10px 25px rgba(249,115,22,0.14);
    }
    .card.done { background: #0f172a; color: #fff; border-color: #1e293b; }
    .card.upcoming { background: #fff7ed; border: 1px solid #fed7aa; }

    .muted { color: #64748b; }
    .tiny {
      font-size: 0.7rem; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .title { font-size: 1rem; font-weight: 900; }
    .badge {
      display: inline-block; padding: 0.25rem 0.55rem; border-radius: 999px;
      background: #fff7ed; color: #ea580c; font-size: 0.66rem; font-weight: 900; letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .vs { color: #f97316; font-size: 1.2rem; font-style: italic; font-weight: 900; }

    .btn {
      border: none; border-radius: 1rem; padding: 1rem; cursor: pointer;
      font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .btn.orange { background: #f97316; color: #fff; width: 100%; }
    .btn.dark { background: #0f172a; color: #fff; }
    .btn.green { background: #10b981; color: #fff; width: 100%; }
    .btn.red { background: #dc2626; color: #fff; width: 100%; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .input-block { background: #e2e8f0; padding: 1rem; border-radius: 1rem; margin-bottom: 1rem; }
    .input, .select {
      width: 100%; border: none; outline: none; background: #fff; color: #0f172a;
      border-radius: 0.8rem; padding: 1rem; font-weight: 900; text-transform: uppercase;
    }
    .input-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

    .autocomplete { position: relative; }
    .autocomplete-list {
      position: absolute; top: calc(100% - 0.15rem); left: 0; right: 0; z-index: 100;
      background: #fff; border: 2px solid #e2e8f0; border-top: none; border-radius: 0 0 0.8rem 0.8rem;
      max-height: 220px; overflow-y: auto; display: none;
      box-shadow: 0 10px 15px rgba(0,0,0,0.08);
    }
    .autocomplete-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.85rem 1rem; border-bottom: 1px solid #f1f5f9; cursor: pointer;
      font-weight: 700; font-size: 0.85rem;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: #f8fafc; }
    .danger-x {
      color: #ef4444; font-size: 1.35rem; font-weight: 900; line-height: 1;
      padding: 0 0.35rem; border-radius: 999px; cursor: pointer;
    }
    .danger-x:hover { background: #fee2e2; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .row.wrap { flex-wrap: wrap; }

    .player-row {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      padding: 1rem; border-bottom: 1px solid #f1f5f9;
    }
    .player-row:last-child { border-bottom: none; }

    .player-left {
      display: flex; align-items: flex-start; gap: 0.85rem; min-width: 0;
    }
    .player-number {
      min-width: 2rem;
      font-size: 1.1rem;
      font-weight: 900;
      color: #64748b;
      line-height: 1.2;
      padding-top: 0.05rem;
    }

    .small-btn {
      border: none; background: none; cursor: pointer; font-size: 0.68rem;
      font-weight: 900; text-transform: uppercase;
    }
    .small-btn.dark { color: #0f172a; }
    .small-btn.red { color: #f87171; }

    .small-select {
      border: none; background: #f1f5f9; color: #0f172a; border-radius: 0.75rem;
      padding: 0.55rem 0.7rem; font-weight: 900;
    }

    .score-box {
      width: 4.5rem; height: 4.5rem; border: 2px solid transparent; outline: none;
      background: #f1f5f9; border-radius: 1rem; text-align: center;
      font-size: 1.45rem; font-weight: 900;
    }
    .score-box:focus { border-color: #f97316; }

    .toggle-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .toggle-btn {
      flex: 1; border: none; border-radius: 1rem; padding: 0.9rem 1rem; cursor: pointer;
      background: #e2e8f0; color: #475569; font-weight: 900; font-size: 0.72rem;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .toggle-btn.active { background: #0f172a; color: #fff; }

    .status-chip {
      display: inline-block; margin-left: 0.35rem; padding: 0.12rem 0.45rem;
      border-radius: 999px; background: #e2e8f0; color: #475569;
      font-size: 0.66rem; font-weight: 900; vertical-align: middle;
    }
    .status-chip.ready { background: #d1fae5; color: #047857; }
    .status-chip.warning { background: #fef3c7; color: #b45309; }
    .team-card { border: 1px solid #e2e8f0; border-radius: 1rem; padding: 0.9rem; margin-top: 0.75rem; }
    .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.65rem; }
    .helper-text { margin-top: 0.5rem; font-size: 0.72rem; line-height: 1.45; color: #64748b; }

    .hidden { display: none !important; }
    .center { text-align: center; }
  </style>
</head>
<body>
  <datalist id="events-list"></datalist>

  <div class="app">
    <div class="sticky">
      <div class="header">
        <div class="brand">Match<span>Flow</span></div>
        <div id="current-match-ui"></div>
      </div>

      <div id="court-bar" class="court-bar"></div>

      <div class="tab-bar">
        <button id="tab-players" class="tab-btn active" onclick="switchTab('players')">Players</button>
        <button id="tab-schedule" class="tab-btn" onclick="switchTab('schedule')">Schedule</button>
        <button id="tab-leaderboard" class="tab-btn" onclick="switchTab('leaderboard')">Leaderboard</button>
      </div>
    </div>

    <main>
      <section id="view-players">
        <div id="match-format-card"></div>

        <div id="player-list-card" class="card" style="padding:0; overflow:hidden;"></div>

        <div class="input-block">
          <div id="active-court-add-label" class="tiny muted" style="margin-bottom:0.5rem;"></div>

          <div class="autocomplete">
            <input
              id="add-name"
              class="input"
              type="text"
              placeholder="PLAYER NAME"
              autocomplete="off"
              onfocus="showPlayerSuggestions('add-name','add-dupr','add-dropdown')"
              oninput="showPlayerSuggestions('add-name','add-dupr','add-dropdown')"
            />
            <div id="add-dropdown" class="autocomplete-list"></div>
          </div>

          <div class="input-row">
            <input id="add-dupr" class="input" type="text" placeholder="DUPR ID (OPTIONAL)" />
            <button class="btn dark" style="padding:0 1.2rem;" onclick="addPlayer()">Add</button>
          </div>
        </div>

        <div id="fixed-team-setup"></div>

        <button class="btn red" style="width:100%;" onclick="clearData()">Clear Data</button>
      </section>

      <section id="view-schedule" class="hidden">
        <div id="schedule-list"></div>
      </section>

      <section id="view-leaderboard" class="hidden">
        <div id="leaderboard-meta"></div>
        <div id="leaderboard-list"></div>
      </section>
    </main>
  </div>

  <script>
    const MAX_COURTS = 6;
    const DEFAULT_SCORE = 0;
    const UPCOMING_PREVIEW_COUNT = 8;
    const MATCH_FORMATS = {
      ROTATING_DOUBLES: 'ROTATING_DOUBLES',
      SINGLES: 'SINGLES',
      FIXED_DOUBLES: 'FIXED_DOUBLES'
    };
    const MATCH_FORMAT_LABELS = {
      ROTATING_DOUBLES: 'Rotating Doubles',
      SINGLES: 'Singles',
      FIXED_DOUBLES: 'Fixed Partner Doubles'
    };

    // Fixed Matrix updated to the ultimate versions (0-indexed)
    const FIXED_MATCH_MATRIX = {
      5: [
        { teamA: [0, 1], teamB: [2, 3] }, // R1
        { teamA: [0, 2], teamB: [1, 4] }, // R2
        { teamA: [0, 3], teamB: [2, 4] }, // R3
        { teamA: [0, 4], teamB: [1, 3] }, // R4
        { teamA: [1, 2], teamB: [3, 4] }  // R5
      ],
      6: [
        { teamA: [0, 2], teamB: [1, 5] }, // R1: 1 3 v 2 6
        { teamA: [0, 4], teamB: [2, 3] }, // R2: 5 1 v 4 3
        { teamA: [4, 5], teamB: [1, 3] }, // R3: 6 5 v 2 4
        { teamA: [0, 1], teamB: [2, 5] }, // R4: 1 2 v 3 6
        { teamA: [2, 4], teamB: [0, 3] }, // R5: 5 3 v 4 1
        { teamA: [1, 4], teamB: [3, 5] }, // R6: 2 5 v 6 4
        { teamA: [0, 5], teamB: [1, 2] }, // R7: 1 6 v 3 2
        { teamA: [3, 4], teamB: [0, 2] }, // R8: 4 5 v 3 1
        { teamA: [4, 5], teamB: [1, 3] }, // R9: 6 5 v 2 4
        { teamA: [0, 1], teamB: [2, 5] }, // R10: 1 2 v 3 6
        { teamA: [0, 4], teamB: [2, 3] }, // R11: 5 1 v 4 3
        { teamA: [1, 4], teamB: [3, 5] }  // R12: 2 5 v 6 4
      ],
      7: [
        { teamA: [3, 5], teamB: [4, 6] }, // R1:  4 6 v 5 7
        { teamA: [0, 1], teamB: [2, 6] }, // R2:  1 2 v 3 7
        { teamA: [2, 3], teamB: [4, 5] }, // R3:  3 4 v 5 6
        { teamA: [0, 4], teamB: [5, 6] }, // R4:  1 5 v 6 7
        { teamA: [0, 3], teamB: [1, 2] }, // R5:  1 4 v 2 3
        { teamA: [1, 5], teamB: [3, 6] }, // R6:  2 6 v 4 7
        { teamA: [0, 6], teamB: [2, 5] }, // R7:  1 7 v 3 6
        { teamA: [1, 3], teamB: [2, 4] }, // R8:  2 4 v 3 5
        { teamA: [0, 5], teamB: [1, 6] }, // R9:  1 6 v 2 7
        { teamA: [0, 2], teamB: [3, 4] }, // R10: 1 3 v 4 5
        { teamA: [1, 4], teamB: [2, 3] }, // R11: 2 5 v 3 4
        { teamA: [0, 1], teamB: [5, 6] }, // R12: 1 2 v 6 7
        { teamA: [0, 4], teamB: [2, 5] }, // R13: 1 5 v 3 6
        { teamA: [1, 3], teamB: [4, 6] }  // R14: 2 4 v 5 7
      ],
      8: [
        { teamA: [0, 1], teamB: [2, 3] }, // R1
        { teamA: [4, 5], teamB: [6, 7] }, // R2
        { teamA: [0, 2], teamB: [1, 4] }, // R3
        { teamA: [3, 6], teamB: [5, 7] }, // R4
        { teamA: [0, 4], teamB: [1, 5] }, // R5
        { teamA: [2, 6], teamB: [3, 7] }, // R6
        { teamA: [1, 2], teamB: [5, 6] }, // R7
        { teamA: [0, 3], teamB: [4, 7] }, // R8
        { teamA: [0, 5], teamB: [1, 6] }, // R9
        { teamA: [2, 7], teamB: [3, 4] }, // R10
        { teamA: [0, 6], teamB: [1, 3] }, // R11
        { teamA: [0, 7], teamB: [2, 5] }, // R12
        { teamA: [1, 7], teamB: [4, 6] }, // R13
        { teamA: [2, 4], teamB: [3, 5] }  // R14
      ]
    };

    const STORAGE_KEYS = {
      state: 'pickleMatchV12_7_15_state',
      memoryPlayers: 'pickleMatchV12_7_15_memoryPlayers'
    };

    let state = loadState();

    function createCourt(index = 1) {
      const id = Date.now() + Math.random();
      return {
        id,
        name: `Court ${index}`,
        eventName: `Event ${index}`,
        eventDate: getLocalYYYYMMDD(),
        location: '',
        scoreType: 'RALLY',
        matchFormat: MATCH_FORMATS.ROTATING_DOUBLES,
        fixedTeams: [],
        players: [],
        completedMatches: [],
        currentMatch: null,
        roundCounter: 1,
        futureMatches: [],
        pairingHistory: {},
        matchupHistory: {},
        recentAppearances: {},
        matchHistory: [],
        editTargetRound: null
      };
    }

    function isValidMatchFormat(value) {
      return Object.values(MATCH_FORMATS).includes(value);
    }

    function inferMatchFormat(match, fallback = MATCH_FORMATS.ROTATING_DOUBLES) {
      if (isValidMatchFormat(match?.matchFormat)) return match.matchFormat;
      if (match?.teamAIds?.length === 1 && match?.teamBIds?.length === 1) {
        return MATCH_FORMATS.SINGLES;
      }
      return isValidMatchFormat(fallback) ? fallback : MATCH_FORMATS.ROTATING_DOUBLES;
    }

    function migrateCourtState(court) {
      court.players = Array.isArray(court.players) ? court.players : [];
      court.completedMatches = Array.isArray(court.completedMatches) ? court.completedMatches : [];
      court.matchFormat = isValidMatchFormat(court.matchFormat)
        ? court.matchFormat
        : MATCH_FORMATS.ROTATING_DOUBLES;
      court.fixedTeams = Array.isArray(court.fixedTeams) ? court.fixedTeams : [];
      if (typeof court.location !== 'string') court.location = '';
      if (!court.scoreType) court.scoreType = 'RALLY';

      court.players.forEach(player => {
        if (typeof player.totalScore !== 'number') player.totalScore = DEFAULT_SCORE;
        if (typeof player.wins !== 'number') player.wins = 0;
        if (typeof player.losses !== 'number') player.losses = 0;
        if (typeof player.isActive !== 'boolean') player.isActive = true;
      });

      const validPlayerIds = new Set(court.players.map(player => player.id));
      const assignedPlayerIds = new Set();
      court.fixedTeams = court.fixedTeams.map((team, index) => {
        const playerIds = [];
        (Array.isArray(team?.playerIds) ? team.playerIds : []).forEach(playerId => {
          if (
            playerIds.length < 2 &&
            validPlayerIds.has(playerId) &&
            !assignedPlayerIds.has(playerId)
          ) {
            playerIds.push(playerId);
            assignedPlayerIds.add(playerId);
          }
        });
        return {
          id: team?.id ?? (Date.now() + index + Math.random()),
          playerIds
        };
      }).filter(team => team.playerIds.length > 0);

      court.completedMatches.forEach(match => {
        match.teamAIds = Array.isArray(match.teamAIds) ? match.teamAIds : [];
        match.teamBIds = Array.isArray(match.teamBIds) ? match.teamBIds : [];
        match.matchFormat = inferMatchFormat(match, court.matchFormat);
      });

      if (court.currentMatch) {
        court.currentMatch.teamAIds = Array.isArray(court.currentMatch.teamAIds) ? court.currentMatch.teamAIds : [];
        court.currentMatch.teamBIds = Array.isArray(court.currentMatch.teamBIds) ? court.currentMatch.teamBIds : [];
        court.currentMatch.matchFormat = inferMatchFormat(court.currentMatch, court.matchFormat);
      }

      court.roundCounter = Number.isInteger(court.roundCounter) ? court.roundCounter : 1;
      court.futureMatches = [];
      court.pairingHistory = court.pairingHistory && typeof court.pairingHistory === 'object' ? court.pairingHistory : {};
      court.matchupHistory = court.matchupHistory && typeof court.matchupHistory === 'object' ? court.matchupHistory : {};
      court.recentAppearances = court.recentAppearances && typeof court.recentAppearances === 'object' ? court.recentAppearances : {};
      court.matchHistory = Array.isArray(court.matchHistory) ? court.matchHistory : [];
      court.editTargetRound = null;
      return court;
    }

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEYS.state);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed?.courts?.length) {
            if (!parsed.leaderboardMode) parsed.leaderboardMode = 'court';
            parsed.courts.forEach(migrateCourtState);
            return parsed;
          }
        }
      } catch (e) {}

      const firstCourt = createCourt(1);
      return {
        activeTab: 'players',
        activeCourtId: firstCourt.id,
        leaderboardMode: 'court',
        courts: [firstCourt]
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEYS.state, JSON.stringify(state));
    }

    function loadMemoryPlayers() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEYS.memoryPlayers) || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveMemoryPlayers(players) {
      localStorage.setItem(STORAGE_KEYS.memoryPlayers, JSON.stringify(players));
    }

    function getMemoryPlayers() {
      return loadMemoryPlayers();
    }

    function toTitleCase(str) {
      return String(str || '')
        .trim()
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .split(' ')
        .map(word => word ? word.charAt(0).toUpperCase() + word.slice(1) : '')
        .join(' ');
    }

    function normalizePlayerName(name) {
      return String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function normalizeDuprId(duprId) {
      return String(duprId || '').trim().toLowerCase();
    }

    function isSamePlayerIdentity(firstPlayer, secondPlayer) {
      const firstName = normalizePlayerName(firstPlayer?.name);
      const secondName = normalizePlayerName(secondPlayer?.name);
      if (firstName && secondName && firstName === secondName) return true;

      const firstDuprId = normalizeDuprId(firstPlayer?.duprId);
      const secondDuprId = normalizeDuprId(secondPlayer?.duprId);
      return Boolean(firstDuprId && secondDuprId && firstDuprId === secondDuprId);
    }

    function findAddedPlayer(name, duprId = '', excludedCourtId = null, excludedPlayerId = null) {
      const candidate = { name, duprId };
      for (const court of state.courts) {
        const player = court.players.find(item => {
          const isExcluded = court.id === excludedCourtId && item.id === excludedPlayerId;
          return !isExcluded && isSamePlayerIdentity(item, candidate);
        });
        if (player) return { court, player };
      }
      return null;
    }

    function upsertMemoryPlayer(name, duprId = '') {
      const trimmed = toTitleCase(name || '');
      if (!trimmed) return;

      const list = getMemoryPlayers();
      const existing = list.find(p => isSamePlayerIdentity(p, { name: trimmed, duprId }));

      if (existing) {
        existing.name = trimmed;
        if (duprId !== undefined) existing.duprId = (duprId || '').trim();
      } else {
        list.push({ name: trimmed, duprId: (duprId || '').trim() });
      }

      list.sort((a, b) => a.name.localeCompare(b.name));
      saveMemoryPlayers(list);
      updateEventsList();
    }

    function deleteMemoryPlayer(name) {
      const key = (name || '').trim().toLowerCase();
      const filtered = getMemoryPlayers().filter(p => p.name.toLowerCase() !== key);
      saveMemoryPlayers(filtered);
      updateEventsList();
    }

    function updateEventsList() {
      const dl = document.getElementById('events-list');
      if (!dl) return;
      const events = [...new Set(state.courts.map(c => c.eventName).filter(Boolean))];
      dl.innerHTML = events.map(ev => `<option value="${escapeHtml(ev)}"></option>`).join('');
    }

    function getCourtById(id) {
      return state.courts.find(c => c.id === id);
    }

    function getSelectedCourt() {
      return getCourtById(state.activeCourtId) || state.courts[0];
    }

    function getPlayerById(court, playerId) {
      return court.players.find(p => p.id === playerId);
    }

    function getActivePlayers(court) {
      return court.players.filter(p => p.isActive !== false);
    }

    function getCompletedMatches(court) {
      return court.completedMatches || [];
    }

    function getMatchFormat(court) {
      return isValidMatchFormat(court?.matchFormat)
        ? court.matchFormat
        : MATCH_FORMATS.ROTATING_DOUBLES;
    }

    function getMatchFormatLabel(courtOrFormat) {
      const format = typeof courtOrFormat === 'string' ? courtOrFormat : getMatchFormat(courtOrFormat);
      return MATCH_FORMAT_LABELS[format] || MATCH_FORMAT_LABELS.ROTATING_DOUBLES;
    }

    function getMatchTeamSize(court, match = null) {
      const format = match ? inferMatchFormat(match, getMatchFormat(court)) : getMatchFormat(court);
      return format === MATCH_FORMATS.SINGLES ? 1 : 2;
    }

    function getFixedTeamForPlayer(court, playerId) {
      return (court.fixedTeams || []).find(team => team.playerIds.includes(playerId)) || null;
    }

    function getAssignedFixedTeamPlayerIds(court, excludedTeamId = null) {
      return new Set(
        (court.fixedTeams || [])
          .filter(team => team.id !== excludedTeamId)
          .flatMap(team => team.playerIds || [])
      );
    }

    function sameTeamIds(firstIds, secondIds) {
      if (!Array.isArray(firstIds) || !Array.isArray(secondIds) || firstIds.length !== secondIds.length) return false;
      const sortedFirst = [...firstIds].sort((a, b) => a - b);
      const sortedSecond = [...secondIds].sort((a, b) => a - b);
      return sortedFirst.every((id, index) => id === sortedSecond[index]);
    }

    function getReadyFixedTeams(court) {
      return (court.fixedTeams || []).filter(team => {
        if (!Array.isArray(team.playerIds) || team.playerIds.length !== 2) return false;
        if (new Set(team.playerIds).size !== 2) return false;
        return team.playerIds.every(playerId => getPlayerById(court, playerId)?.isActive !== false);
      });
    }

    function isFixedTeamSide(court, playerIds) {
      return getReadyFixedTeams(court).some(team => sameTeamIds(team.playerIds, playerIds));
    }

    function canScheduleCourt(court) {
      const format = getMatchFormat(court);
      if (format === MATCH_FORMATS.SINGLES) return getActivePlayers(court).length >= 2;
      if (format === MATCH_FORMATS.FIXED_DOUBLES) return getReadyFixedTeams(court).length >= 2;
      return getActivePlayers(court).length >= 4;
    }

    function getWaitingMessage(court) {
      const format = getMatchFormat(court);
      if (format === MATCH_FORMATS.SINGLES) return 'Waiting for at least 2 active players';
      if (format === MATCH_FORMATS.FIXED_DOUBLES) return 'Waiting for at least 2 ready teams';
      return 'Waiting for at least 4 active players';
    }

    function matchIncludesPlayer(match, playerId) {
      return [...(match?.teamAIds || []), ...(match?.teamBIds || [])].includes(playerId);
    }

    function playerHasCompletedMatch(court, playerId) {
      return getCompletedMatches(court).some(match => matchIncludesPlayer(match, playerId));
    }

    function fixedTeamHasCompletedMatch(court, team) {
      return getCompletedMatches(court).some(match =>
        sameTeamIds(match.teamAIds, team.playerIds) || sameTeamIds(match.teamBIds, team.playerIds)
      );
    }

    function getLocalYYYYMMDD() {
      const now = new Date();
      const tzOffset = now.getTimezoneOffset() * 60000;
      return new Date(now - tzOffset).toISOString().slice(0, 10);
    }

    function switchTab(tab) {
      state.activeTab = tab;
      saveState();
      renderApp();
    }

    function switchCourt(courtId) {
      state.activeCourtId = courtId;
      saveState();
      renderApp();
    }

    function addCourt() {
      if (state.courts.length >= MAX_COURTS) {
        alert(`Maximum ${MAX_COURTS} courts allowed.`);
        return;
      }

      const newCourt = createCourt(state.courts.length + 1);
      state.courts.push(newCourt);
      state.activeCourtId = newCourt.id;
      saveState();
      renderApp();
    }

    function clearData() {
      const ok = confirm('Clear all current event data? Player Name and DUPR ID memory will be kept.');
      if (!ok) return;

      const preservedMemory = getMemoryPlayers();
      const firstCourt = createCourt(1);

      state = {
        activeTab: 'players',
        activeCourtId: firstCourt.id,
        leaderboardMode: 'court',
        courts: [firstCourt]
      };

      saveMemoryPlayers(preservedMemory);
      saveState();
      updateEventsList();
      renderApp();
    }

      const court = getSelectedCourt();
      const nextName = prompt('Edit Event Name', court.eventName || court.name);
      if (nextName === null) return;
      court.eventName = (nextName || '').trim() || court.name;
      saveState();
      updateEventsList();

    }

    function editCourtLocation() {
      const court = getSelectedCourt();
      const nextLocation = prompt('Edit Event Location', court.location || '');
      if (nextLocation === null) return;
      court.location = (nextLocation || '').trim();
      saveState();
      renderApp();

      saveState();
      renderApp();
    }

    function updateMatchFormat(value) {
      const court = getSelectedCourt();
      if (!isValidMatchFormat(value) || value === getMatchFormat(court)) return;

        alert('Match Format is locked after the first completed match. Use a new court or clear the event to change formats.');

    function toggleLeaderboardMode(mode) {
      if (mode === 'all' && hasMixedLeaderboardUnits()) {
        alert('All Courts ranking is unavailable when individual and fixed-team courts are mixed. View each court separately.');
        return;
      }
      state.leaderboardMode = mode;
      saveState();
      renderApp();

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showPlayerSuggestions(nameInputId, duprInputId, dropdownId) {
      const nameInput = document.getElementById(nameInputId);
      const duprInput = document.getElementById(duprInputId);
      const dropdown = document.getElementById(dropdownId);
      const query = (nameInput.value || '').trim().toLowerCase();

      const addedPlayers = state.courts.flatMap(court => court.players);
      const list = getMemoryPlayers()
        .filter(player => !addedPlayers.some(addedPlayer => isSamePlayerIdentity(addedPlayer, player)))
        .filter(p => !query || p.name.toLowerCase().includes(query));

      if (!list.length) {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        return;
      }

      dropdown.innerHTML = list.map(player => `
        <div class="autocomplete-item" onclick="selectMemoryPlayerAndAdd('${escapeHtml(player.name)}', '${escapeHtml(player.duprId || '')}', '${nameInputId}', '${duprInputId}', '${dropdownId}')">
          <div style="flex:1;">
            ${escapeHtml(player.name)}${player.duprId ? ` <span class="muted" style="font-weight:400; font-size:0.75rem;">· ${escapeHtml(player.duprId)}</span>` : ''}
          </div>
          <div class="danger-x" onclick="event.stopPropagation(); deleteMemoryPlayer('${escapeHtml(player.name)}'); showPlayerSuggestions('${nameInputId}','${duprInputId}','${dropdownId}');">×</div>
        </div>
      `).join('');

      dropdown.style.display = 'block';
      if (duprInput) duprInput.value = '';
    }

    function hideAutocompleteLists() {
      document.querySelectorAll('.autocomplete-list').forEach(el => {
        el.style.display = 'none';
      });
    }

    function selectMemoryPlayerAndAdd(name, duprId, nameInputId, duprInputId, dropdownId) {
      document.getElementById(nameInputId).value = name;
      document.getElementById(duprInputId).value = duprId || '';
      document.getElementById(dropdownId).style.display = 'none';
      
      addPlayer();
    }

    function addPlayer() {
      const court = getSelectedCourt();
      const nameInput = document.getElementById('add-name');
      const duprInput = document.getElementById('add-dupr');

      const name = toTitleCase((nameInput.value || '').trim());
      const duprId = (duprInput.value || '').trim();

      if (!name) return;

      const existing = findAddedPlayer(name, duprId);
      if (existing) {
        const location = existing.court.id === court.id ? 'this court' : existing.court.name;
        alert(`Player already exists on ${location}. Move the existing player instead of adding a duplicate.`);
        return;
      }

      court.players.push({
        id: Date.now() + Math.random(),
        name,
        duprId,
        totalScore: DEFAULT_SCORE,
        wins: 0,
        losses: 0,
        isActive: true
      });

      upsertMemoryPlayer(name, duprId);

      nameInput.value = '';
      duprInput.value = '';
      hideAutocompleteLists();

      if (getMatchFormat(court) !== MATCH_FORMATS.FIXED_DOUBLES) {
        court.currentMatch = null;
      }
      rebuildCourtScheduling(court);

      saveState();
      renderApp();
    }

    function editPlayer(playerId) {
      const court = getSelectedCourt();
      const player = getPlayerById(court, playerId);
      if (!player) return;

      const nextName = prompt('Edit Player Name', player.name);
      if (nextName === null) return;

      const trimmedName = toTitleCase(nextName.trim());
      if (!trimmedName) return;

      const duprId = prompt('Edit DUPR ID', player.duprId || '');
      if (duprId === null) return;

      const trimmedDuprId = duprId.trim();
      const existing = findAddedPlayer(trimmedName, trimmedDuprId, court.id, player.id);
      if (existing) {
        alert(`That player already exists on ${existing.court.name}.`);
        return;
      }

      const previousIdentity = { name: player.name, duprId: player.duprId };
      saveMemoryPlayers(
        getMemoryPlayers().filter(memoryPlayer => !isSamePlayerIdentity(memoryPlayer, previousIdentity))
      );
      player.name = trimmedName;
      player.duprId = trimmedDuprId;
      upsertMemoryPlayer(player.name, player.duprId);

      saveState();
      renderApp();
    }

    function syncFixedTeamCreateOptions(changedSlot) {
      const playerASelect = document.getElementById('fixed-team-player-a');
      const playerBSelect = document.getElementById('fixed-team-player-b');
      if (!playerASelect || !playerBSelect) return;

      const changedSelect = changedSlot === 'b' ? playerBSelect : playerASelect;
      const otherSelect = changedSlot === 'b' ? playerASelect : playerBSelect;
      if (changedSelect.value && changedSelect.value === otherSelect.value) {
        otherSelect.value = '';
      }

      const playerAId = playerASelect.value;
      const playerBId = playerBSelect.value;
      const court = getSelectedCourt();
      const assignedIds = getAssignedFixedTeamPlayerIds(court);
      const unassignedPlayers = court.players.filter(player => !assignedIds.has(player.id));

      const rebuildOptions = (select, selectedId, excludedId, placeholder) => {
        select.innerHTML = `
          <option value="">${placeholder}</option>
          ${unassignedPlayers
            .filter(player => String(player.id) !== excludedId)
            .map(player => `
              <option value="${player.id}">
                ${escapeHtml(player.name)}${player.isActive === false ? ' (Dropped)' : ''}
              </option>
            `).join('')}
        `;
        select.value = selectedId;
      };

      rebuildOptions(playerASelect, playerAId, playerBId, 'Select player');
      rebuildOptions(playerBSelect, playerBId, playerAId, 'Select partner');
    }

    function createFixedTeam() {
      const court = getSelectedCourt();
      if (getMatchFormat(court) !== MATCH_FORMATS.FIXED_DOUBLES) return;

      const playerAId = Number(document.getElementById('fixed-team-player-a')?.value);
      const playerBId = Number(document.getElementById('fixed-team-player-b')?.value);
      const assigned = getAssignedFixedTeamPlayerIds(court);

      if (!playerAId || !playerBId) {
        alert('Select two players to create a team.');
        return;
      }
      if (playerAId === playerBId) {
        alert('A team must contain two different players.');
        return;
      }
      if (!getPlayerById(court, playerAId) || !getPlayerById(court, playerBId)) {
        alert('One of the selected players is no longer available.');
        renderApp();
        return;
      }
      if (assigned.has(playerAId) || assigned.has(playerBId)) {
        alert('Each player can belong to only one fixed team.');
        renderApp();
        return;
      }

      court.fixedTeams.push({
        id: Date.now() + Math.random(),
        playerIds: [playerAId, playerBId]
      });
      court.currentMatch = null;
      rebuildCourtScheduling(court);
      saveState();
      renderApp();
    }

    function updateFixedTeamMember(teamId, slotIndex, playerIdValue) {
      const court = getSelectedCourt();
      const team = (court.fixedTeams || []).find(item => item.id === teamId);
      const playerId = Number(playerIdValue);
      if (!team || !playerId || !getPlayerById(court, playerId)) {
        renderApp();
        return;
      }
      if (fixedTeamHasCompletedMatch(court, team)) {
        alert('A team cannot be edited after it has completed a match.');
        renderApp();
        return;
      }

      const nextPlayerIds = [...team.playerIds];
      while (nextPlayerIds.length < 2) nextPlayerIds.push(null);
      const otherSlot = slotIndex === 0 ? 1 : 0;
      if (nextPlayerIds[otherSlot] === playerId) {
        alert('A team must contain two different players.');
        renderApp();
        return;
      }

      const assignedElsewhere = getAssignedFixedTeamPlayerIds(court, team.id);
      if (assignedElsewhere.has(playerId)) {
        alert('That player is already assigned to another team.');
        renderApp();
        return;
      }

      nextPlayerIds[slotIndex] = playerId;
      team.playerIds = nextPlayerIds.filter(Boolean);
      court.currentMatch = null;
      rebuildCourtScheduling(court);
      saveState();
      renderApp();
    }

    function removeFixedTeam(teamId) {
      const court = getSelectedCourt();
      const team = (court.fixedTeams || []).find(item => item.id === teamId);
      if (!team) return;
      if (fixedTeamHasCompletedMatch(court, team)) {
        alert('A team cannot be removed after it has completed a match. Drop a player to make the team unavailable instead.');
        return;
      }
      if (!confirm('Remove this fixed team? The players will become unassigned.')) return;

      court.fixedTeams = court.fixedTeams.filter(item => item.id !== teamId);
      court.currentMatch = null;
      rebuildCourtScheduling(court);
      saveState();
      renderApp();
    }

    function movePlayerToCourt(playerId, targetCourtId) {
      const fromCourt = getSelectedCourt();
      const toCourt = getCourtById(Number(targetCourtId));
      if (!fromCourt || !toCourt || fromCourt.id === toCourt.id) return;

      const playerIndex = fromCourt.players.findIndex(p => p.id === playerId);
      if (playerIndex < 0) return;

      const player = fromCourt.players[playerIndex];
      if (playerHasCompletedMatch(fromCourt, playerId)) {
        alert('This player has completed matches on this court and cannot be moved without breaking its history and DUPR export. Start a new court for the player instead.');
        renderApp();
        return;
      }

      const identityConflict = toCourt.players.some(item => isSamePlayerIdentity(item, player));
      if (identityConflict) {
        alert('That player already exists on the destination court.');
        renderApp();
        return;
      }

      const fixedTeam = getFixedTeamForPlayer(fromCourt, playerId);
      if (fixedTeam) {
        const partner = fixedTeam.playerIds
          .filter(id => id !== playerId)
          .map(id => getPlayerById(fromCourt, id)?.name)
          .filter(Boolean)
          .join(' / ');
        const ok = confirm(
          `Moving ${player.name} will dissolve their fixed team${partner ? ` with ${partner}` : ''}. Continue?`
        );
        if (!ok) {
          renderApp();
          return;
        }
        fromCourt.fixedTeams = fromCourt.fixedTeams.filter(team => team.id !== fixedTeam.id);
      }

      fromCourt.players.splice(playerIndex, 1);
      if (matchIncludesPlayer(fromCourt.currentMatch, playerId)) fromCourt.currentMatch = null;
      rebuildCourtScheduling(fromCourt);

      player.isActive = true;
      toCourt.players.push(player);
      rebuildCourtScheduling(toCourt);

      saveState();
      renderApp();
    }

    function handleDrop(playerId) {
      const court = getSelectedCourt();
      const player = getPlayerById(court, playerId);
      if (!player) return;
      player.isActive = false;

      if (matchIncludesPlayer(court.currentMatch, playerId)) court.currentMatch = null;
      rebuildCourtScheduling(court);
      
      saveState();
      renderApp();
    }

    function handleActivate(playerId) {
      const court = getSelectedCourt();
      const player = getPlayerById(court, playerId);
      if (!player) return;
      player.isActive = true;

      rebuildCourtScheduling(court);

      saveState();
      renderApp();
    }

    function removePlayerPermanently(playerId) {
      const court = getSelectedCourt();
      const idx = court.players.findIndex(p => p.id === playerId);
      if (idx < 0) return;

      if (playerHasCompletedMatch(court, playerId)) {
        alert('This player has completed matches and cannot be permanently removed without breaking match history and DUPR export. Keep the player dropped instead.');
        return;
      }

      const fixedTeam = getFixedTeamForPlayer(court, playerId);
      if (fixedTeam) {
        court.fixedTeams = court.fixedTeams.filter(team => team.id !== fixedTeam.id);
      }
      court.players.splice(idx, 1);

      if (matchIncludesPlayer(court.currentMatch, playerId)) court.currentMatch = null;
      rebuildCourtScheduling(court);

      saveState();
      renderApp();
    }

    function ensureMatchExists(court) {
      if (court.currentMatch) return;
      if (!canScheduleCourt(court)) return;

      const nextMatch = getNextMatch(court);
      if (nextMatch) {
        court.currentMatch = nextMatch;
      }
    }

    function rebuildCourtScheduling(court) {
      court.completedMatches = Array.isArray(court.completedMatches) ? court.completedMatches : [];

      if (court.currentMatch) {
        const allIds = [...court.currentMatch.teamAIds, ...court.currentMatch.teamBIds];
        const expectedTeamSize = getMatchTeamSize(court);
        const formatValid = inferMatchFormat(court.currentMatch, getMatchFormat(court)) === getMatchFormat(court);
        const sizesValid =
          court.currentMatch.teamAIds.length === expectedTeamSize &&
          court.currentMatch.teamBIds.length === expectedTeamSize;
        const playersValid = allIds.every(id => getPlayerById(court, id)?.isActive !== false);
        const teamsValid = getMatchFormat(court) !== MATCH_FORMATS.FIXED_DOUBLES || (
          isFixedTeamSide(court, court.currentMatch.teamAIds) &&
          isFixedTeamSide(court, court.currentMatch.teamBIds)
        );
        const valid = formatValid && sizesValid && playersValid && teamsValid;
        if (!valid) court.currentMatch = null;
      }

      court.futureMatches = [];
      court.pairingHistory = {};
      court.matchupHistory = {};
      court.recentAppearances = {};
      court.matchHistory = [];
      court.roundCounter = 1;
      court.editTargetRound = null;

      const completedInOrder = [...court.completedMatches].sort((a, b) => a.round - b.round);
      for (const match of completedInOrder) {
        match.matchFormat = inferMatchFormat(match, getMatchFormat(court));
        applySchedulingHistory(court, match);
        court.roundCounter = Math.max(court.roundCounter, match.round + 1);
      }

      if (court.currentMatch) {
        court.currentMatch.matchFormat = inferMatchFormat(court.currentMatch, getMatchFormat(court));
        court.roundCounter = Math.max(court.roundCounter, court.currentMatch.round + 1);
      }

      recalculatePlayerStats(court);
      ensureMatchExists(court);
    }

    function incrementMapCounter(map, key, amount = 1) {
      map[key] = (map[key] || 0) + amount;
    }

    function pairKey(a, b) {
      return [a, b].sort((x, y) => x - y).join('_');
    }

    function matchupKey(teamAIds, teamBIds) {
      const sideA = [...teamAIds].sort((a, b) => a - b).join('-');
      const sideB = [...teamBIds].sort((a, b) => a - b).join('-');
      return [sideA, sideB].sort().join('__');
    }

    function applySchedulingHistory(court, match) {
      const participants = [...match.teamAIds, ...match.teamBIds];
      court.matchHistory.push({ round: match.round, players: participants });

      participants.forEach(id => {
        court.recentAppearances[id] = (court.recentAppearances[id] || 0) + 1;
      });

      if (match.teamAIds.length === 2) {
        incrementMapCounter(court.pairingHistory, pairKey(match.teamAIds[0], match.teamAIds[1]));
      }
      if (match.teamBIds.length === 2) {
        incrementMapCounter(court.pairingHistory, pairKey(match.teamBIds[0], match.teamBIds[1]));
      }
      incrementMapCounter(court.matchupHistory, matchupKey(match.teamAIds, match.teamBIds));
    }

    function getConsecutiveCount(court, playerId) {
      let count = 0;
      for (let i = court.matchHistory.length - 1; i >= 0; i--) {
        const played = court.matchHistory[i].players.includes(playerId);
        if (!played) break;
        count++;
      }
      return count;
    }

    function getRotatingMatrixMatch(court) {
      const activePlayers = getActivePlayers(court);
      const matrix = FIXED_MATCH_MATRIX[activePlayers.length];
      if (!matrix) return null;

      const targetIndex = court.roundCounter - 1;
      if (targetIndex >= matrix.length) return null; 

      const spec = matrix[targetIndex];
      return {
        round: court.roundCounter++,
        teamAIds: [activePlayers[spec.teamA[0]].id, activePlayers[spec.teamA[1]].id],
        teamBIds: [activePlayers[spec.teamB[0]].id, activePlayers[spec.teamB[1]].id],
        matchFormat: MATCH_FORMATS.ROTATING_DOUBLES,
        scoreA: null,
        scoreB: null
      };
    }

    function combinations(arr, k) {
      const result = [];
      function backtrack(start, combo) {
        if (combo.length === k) {
          result.push([...combo]);
          return;
        }
        for (let i = start; i < arr.length; i++) {
          combo.push(arr[i]);
          backtrack(i + 1, combo);
          combo.pop();
        }
      }
      backtrack(0, []);
      return result;
    }

    function buildRotatingCandidateMatch(court, teamA, teamB) {
      const participants = [...teamA, ...teamB];
      const consecutivePenalty = participants.reduce((sum, id) => {
        const count = getConsecutiveCount(court, id);
        return sum + (count >= 2 ? 1000 : count * 20);
      }, 0);

      const pairPenalty =
        (court.pairingHistory[pairKey(teamA[0], teamA[1])] || 0) * 200 +
        (court.pairingHistory[pairKey(teamB[0], teamB[1])] || 0) * 200;

      const matchupPenalty =
        (court.matchupHistory[matchupKey(teamA, teamB)] || 0) * 60;

      const usagePenalty = participants.reduce((sum, id) => sum + (court.recentAppearances[id] || 0), 0);

      return {
        score: consecutivePenalty + pairPenalty + matchupPenalty + usagePenalty,
        round: court.roundCounter,
        teamAIds: [...teamA],
        teamBIds: [...teamB],
        matchFormat: MATCH_FORMATS.ROTATING_DOUBLES,
        scoreA: null,
        scoreB: null
      };
    }

    function getGeneratedRotatingMatch(court) {
      const activePlayers = getActivePlayers(court).map(p => p.id);
      if (activePlayers.length < 4) return null;

      const allTeams = combinations(activePlayers, 2);
      let best = null;

      for (let i = 0; i < allTeams.length; i++) {
        for (let j = i + 1; j < allTeams.length; j++) {
          const teamA = allTeams[i];
          const teamB = allTeams[j];
          const unique = new Set([...teamA, ...teamB]);
          if (unique.size !== 4) continue;

          const candidate = buildRotatingCandidateMatch(court, teamA, teamB);
          if (!best || candidate.score < best.score) best = candidate;
        }
      }

      if (!best) return null;
      best.round = court.roundCounter++;
      return best;
    }

    function getNextRotatingDoublesMatch(court) {
      const matrixMatch = getRotatingMatrixMatch(court);
      if (matrixMatch) return matrixMatch;
      return getGeneratedRotatingMatch(court);
    }

    function buildSinglesCandidate(court, playerAId, playerBId) {
      const participants = [playerAId, playerBId];
      const consecutivePenalty = participants.reduce((sum, id) => {
        const count = getConsecutiveCount(court, id);
        return sum + (count >= 2 ? 10000 : count * 40);
      }, 0);
      const repeatOpponentPenalty =
        (court.matchupHistory[matchupKey([playerAId], [playerBId])] || 0) * 1000;
      const usagePenalty = participants.reduce(
        (sum, id) => sum + (court.recentAppearances[id] || 0) * 5,
        0
      );

      return {
        score: consecutivePenalty + repeatOpponentPenalty + usagePenalty,
        round: court.roundCounter,
        teamAIds: [playerAId],
        teamBIds: [playerBId],
        matchFormat: MATCH_FORMATS.SINGLES,
        scoreA: null,
        scoreB: null
      };
    }

    function getNextSinglesMatch(court) {
      const activePlayerIds = getActivePlayers(court).map(player => player.id);
      if (activePlayerIds.length < 2) return null;

      let best = null;
      combinations(activePlayerIds, 2).forEach(([playerAId, playerBId]) => {
        const candidate = buildSinglesCandidate(court, playerAId, playerBId);
        if (!best || candidate.score < best.score) best = candidate;
      });

      if (!best) return null;
      best.round = court.roundCounter++;
      return best;
    }

    function buildFixedDoublesCandidate(court, teamA, teamB) {
      const participants = [...teamA.playerIds, ...teamB.playerIds];
      const consecutivePenalty = participants.reduce((sum, id) => {
        const count = getConsecutiveCount(court, id);
        return sum + (count >= 2 ? 10000 : count * 40);
      }, 0);
      const repeatOpponentPenalty =
        (court.matchupHistory[matchupKey(teamA.playerIds, teamB.playerIds)] || 0) * 1000;
      const usagePenalty = participants.reduce(
        (sum, id) => sum + (court.recentAppearances[id] || 0) * 5,
        0
      );

      return {
        score: consecutivePenalty + repeatOpponentPenalty + usagePenalty,
        round: court.roundCounter,
        teamAIds: [...teamA.playerIds],
        teamBIds: [...teamB.playerIds],
        matchFormat: MATCH_FORMATS.FIXED_DOUBLES,
        scoreA: null,
        scoreB: null
      };
    }

    function getNextFixedDoublesMatch(court) {
      const readyTeams = getReadyFixedTeams(court);
      if (readyTeams.length < 2) return null;

      let best = null;
      combinations(readyTeams, 2).forEach(([teamA, teamB]) => {
        const candidate = buildFixedDoublesCandidate(court, teamA, teamB);
        if (!best || candidate.score < best.score) best = candidate;
      });

      if (!best) return null;
      best.round = court.roundCounter++;
      return best;
    }

    function getNextMatch(court) {
      const format = getMatchFormat(court);
      if (format === MATCH_FORMATS.SINGLES) return getNextSinglesMatch(court);
      if (format === MATCH_FORMATS.FIXED_DOUBLES) return getNextFixedDoublesMatch(court);
      return getNextRotatingDoublesMatch(court);
    }

    function getUpcomingMatchesPreview(court, count = 8) {
      const clone = JSON.parse(JSON.stringify(court));
      clone.players = court.players.map(p => ({ ...p }));
      clone.currentMatch = court.currentMatch ? { ...court.currentMatch } : null;
      clone.completedMatches = (court.completedMatches || []).map(m => ({ ...m }));
      clone.futureMatches = [];
      clone.pairingHistory = JSON.parse(JSON.stringify(court.pairingHistory || {}));
      clone.matchupHistory = JSON.parse(JSON.stringify(court.matchupHistory || {}));
      clone.recentAppearances = JSON.parse(JSON.stringify(court.recentAppearances || {}));
      clone.matchHistory = (court.matchHistory || []).map(m => ({ ...m }));

      const preview = [];
      let virtualCurrent = clone.currentMatch ? { ...clone.currentMatch } : null;

      if (virtualCurrent) {
        preview.push(virtualCurrent);
        applySchedulingHistory(clone, virtualCurrent);
      }

      while (preview.length < count) {
        const next = getNextMatch(clone);
        if (!next) break;
        preview.push(next);
        applySchedulingHistory(clone, next);
      }

      return preview;
    }

    function updateRatings(court, match) {
      const teamAPlayers = match.teamAIds.map(id => getPlayerById(court, id)).filter(Boolean);
      const teamBPlayers = match.teamBIds.map(id => getPlayerById(court, id)).filter(Boolean);
      const expectedTeamSize = getMatchTeamSize(court, match);
      if (teamAPlayers.length !== expectedTeamSize || teamBPlayers.length !== expectedTeamSize) return;

      const actualA = match.scoreA > match.scoreB ? 1 : 0;
      const actualB = match.scoreB > match.scoreA ? 1 : 0;

      teamAPlayers.forEach(player => {
        player.totalScore = (player.totalScore || 0) + match.scoreA;
        if (actualA > actualB) player.wins = (player.wins || 0) + 1;
        else player.losses = (player.losses || 0) + 1;
      });

      teamBPlayers.forEach(player => {
        player.totalScore = (player.totalScore || 0) + match.scoreB;
        if (actualB > actualA) player.wins = (player.wins || 0) + 1;
        else player.losses = (player.losses || 0) + 1;
      });
    }

    function rollbackRatings(court, match) {
      const teamAPlayers = match.teamAIds.map(id => getPlayerById(court, id)).filter(Boolean);
      const teamBPlayers = match.teamBIds.map(id => getPlayerById(court, id)).filter(Boolean);
      const expectedTeamSize = getMatchTeamSize(court, match);
      if (teamAPlayers.length !== expectedTeamSize || teamBPlayers.length !== expectedTeamSize) return;

      const actualA = match.scoreA > match.scoreB ? 1 : 0;
      const actualB = match.scoreB > match.scoreA ? 1 : 0;

      teamAPlayers.forEach(player => {
        player.totalScore = Math.max(0, (player.totalScore || 0) - match.scoreA);
        if (actualA > actualB) player.wins = Math.max(0, (player.wins || 0) - 1);
        else player.losses = Math.max(0, (player.losses || 0) - 1);
      });

      teamBPlayers.forEach(player => {
        player.totalScore = Math.max(0, (player.totalScore || 0) - match.scoreB);
        if (actualB > actualA) player.wins = Math.max(0, (player.wins || 0) - 1);
        else player.losses = Math.max(0, (player.losses || 0) - 1);
      });
    }

    function recalculatePlayerStats(court) {
      court.players.forEach(player => {
        player.totalScore = DEFAULT_SCORE;
        player.wins = 0;
        player.losses = 0;
      });

      getCompletedMatches(court).forEach(match => updateRatings(court, match));
    }

    function submitScoreAction(scoreA, scoreB) {
      const court = getSelectedCourt();
      if (!court.currentMatch) return;

      const a = Number(scoreA);
      const b = Number(scoreB);

      if (!Number.isInteger(a) || !Number.isInteger(b)) {
        alert('Please enter valid integer scores.');
        return;
      }
      if (a < 0 || b < 0) {
        alert('Scores cannot be negative.');
        return;
      }
      if (a === b) {
        alert('Scores cannot be tied.');
        return;
      }

      const finalized = {
        ...court.currentMatch,
        teamAIds: [...court.currentMatch.teamAIds],
        teamBIds: [...court.currentMatch.teamBIds],
        matchFormat: inferMatchFormat(court.currentMatch, getMatchFormat(court)),
        scoreA: a,
        scoreB: b
      };
      court.completedMatches.push(finalized);
      court.currentMatch = null;

      rebuildCourtScheduling(court);

      saveState();
      renderApp();
    }

      if (!match) return;

      const newScoreA = prompt(`Edit Score for Team A (Current: ${match.scoreA}):`, match.scoreA);
      if (newScoreA === null) return; 

      const newScoreB = prompt(`Edit Score for Team B (Current: ${match.scoreB}):`, match.scoreB);
      if (newScoreB === null) return; 

      const a = Number(newScoreA);
      const b = Number(newScoreB);

      if (!Number.isInteger(a) || !Number.isInteger(b)) {
        alert('Logic Error: Scores must be valid integers.');
        return;
      }
      if (a < 0 || b < 0) {
        alert('Logic Error: Scores cannot be negative.');
        return;
      }
      if (a === b) {

        'location','scoreType'
      ]];

    function escapeCSVValue(value) {
      const text = String(value ?? '');
      return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    function serializeCSV(rows) {
      return rows.map(row => row.map(escapeCSVValue).join(',')).join('\n') + '\n';
    }

    function exportDUPRCSV() {
      const rows = buildDUPRTemplate02Rows(state.courts);

      if (rows.length === 1) {
        alert('No completed matches to export.');
        return;
      }

      const csv = serializeCSV(rows);

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = `DUPR_${(getSelectedCourt().eventName || 'Event').replace(/[\/\\?%*:|"<>]/g, '_')}_${getLocalYYYYMMDD()}.csv`;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }

          losses: 0,
          gamesPlayed: 0,
          isActive: status.className === 'ready',
          statusLabel: status.label,
          _courtName: court.name,
          kind: 'team'
        };
        entries.push(entry);
        if (pair.length === 2) entriesByPair.set(key, entry);
      });

      function getOrCreateHistoricalEntry(playerIds) {
        if (playerIds.length !== 2) return null;
        const key = pairKey(playerIds[0], playerIds[1]);
        if (entriesByPair.has(key)) return entriesByPair.get(key);

        const entry = {
          key,
          name: playerIds.map(id => getPlayerById(court, id)?.name || 'Unknown').join(' / '),
          teamLabel: 'Historical Team',
          totalScore: 0,
          wins: 0,
          losses: 0,
          gamesPlayed: 0,
          isActive: false,
          statusLabel: 'Historical',
          _courtName: court.name,
          kind: 'team'
        };
        entries.push(entry);
        entriesByPair.set(key, entry);
        return entry;
      }

      getCompletedMatches(court).forEach(match => {
        if (inferMatchFormat(match, getMatchFormat(court)) !== MATCH_FORMATS.FIXED_DOUBLES) return;
        const teamA = getOrCreateHistoricalEntry(match.teamAIds);
        const teamB = getOrCreateHistoricalEntry(match.teamBIds);
        if (!teamA || !teamB) return;

        teamA.totalScore += Number(match.scoreA) || 0;
        teamB.totalScore += Number(match.scoreB) || 0;
        teamA.gamesPlayed++;
        teamB.gamesPlayed++;
        if (match.scoreA > match.scoreB) {
          teamA.wins++;
          teamB.losses++;
        } else {
          teamB.wins++;
          teamA.losses++;
        }
      });

      return entries;
    }

    function getLeaderboardEntries(court) {
      if (getMatchFormat(court) === MATCH_FORMATS.FIXED_DOUBLES) {
        return buildFixedTeamLeaderboardEntries(court);
      }

      return court.players.map(player => ({
        key: `player_${player.id}`,
        name: player.name,
        teamLabel: getMatchFormatLabel(court),
        totalScore: player.totalScore || DEFAULT_SCORE,
        wins: player.wins || 0,
        losses: player.losses || 0,
        gamesPlayed: (player.wins || 0) + (player.losses || 0),
        isActive: player.isActive !== false,
        statusLabel: player.isActive === false ? 'Dropped' : '',
        _courtName: court.name,
        kind: 'player'
      }));
    }

    function hasMixedLeaderboardUnits() {
      const units = new Set(state.courts.map(court =>
        getMatchFormat(court) === MATCH_FORMATS.FIXED_DOUBLES ? 'team' : 'player'
      ));
      return units.size > 1;
    }

    function renderLeaderboardTab() {
      const court = getSelectedCourt();
      const meta = document.getElementById('leaderboard-meta');
      const list = document.getElementById('leaderboard-list');
      const mixedLeaderboardUnits = hasMixedLeaderboardUnits();
      const leaderboardMode = mixedLeaderboardUnits ? 'court' : state.leaderboardMode;

      meta.innerHTML = `
        <div class="card">
          <div class="row wrap">
            <div style="flex:1; min-width:0;">
              <div class="tiny muted" style="margin-bottom:0.35rem;">Event Name</div>
              <div class="title" style="word-break:break-word;">${escapeHtml(court.eventName || court.name)}</div>
              <div class="tiny" style="color:#94a3b8; margin-top:0.35rem;">${escapeHtml(court.name)} · ${escapeHtml(court.eventDate || getLocalYYYYMMDD())} · ${escapeHtml(getMatchFormatLabel(court))}</div>
            </div>
            <div class="row">
              <button class="btn dark" style="padding:0.75rem 1rem; font-size:0.72rem;" onclick="editCourtEventName()">Edit</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="tiny muted" style="margin-bottom:0.5rem;">Score Type</div>
          <select class="select" onchange="updateCourtScoreType(this.value)">
            <option value="RALLY" ${court.scoreType === 'RALLY' ? 'selected' : ''}>Rally</option>
            <option value="SIDEOUT" ${court.scoreType === 'SIDEOUT' ? 'selected' : ''}>SideOut</option>
          </select>
        </div>

        <div class="card">
          <div class="row wrap">
            <div style="flex:1; min-width:0;">
              <div class="tiny muted" style="margin-bottom:0.35rem;">Location</div>
              <div class="title" style="font-size:0.95rem; word-break:break-word;">${court.location ? escapeHtml(court.location) : '<span class="muted">Not set</span>'}</div>
            </div>
            <button class="btn dark" style="padding:0.75rem 1rem; font-size:0.72rem;" onclick="editCourtLocation()">Edit</button>
          </div>
        </div>

        <div class="toggle-row">
          <button class="toggle-btn ${leaderboardMode === 'court' ? 'active' : ''}" onclick="toggleLeaderboardMode('court')">${escapeHtml(court.name)}</button>
          <button class="toggle-btn ${leaderboardMode === 'all' ? 'active' : ''}" onclick="toggleLeaderboardMode('all')" ${mixedLeaderboardUnits ? 'disabled' : ''}>All Courts</button>
        </div>

        ${mixedLeaderboardUnits ? '<div class="helper-text" style="margin-top:-0.5rem; margin-bottom:1rem;">All Courts is disabled because team scores and individual scores are different ranking units.</div>' : ''}

        <button class="btn green" onclick="exportDUPRCSV()">Export to DUPR CSV</button>
      `;

      const pool = leaderboardMode === 'all'
        ? state.courts.flatMap(getLeaderboardEntries)
        : getLeaderboardEntries(court);

      const sorted = [...pool].sort((a, b) =>
        (b.totalScore || DEFAULT_SCORE) - (a.totalScore || DEFAULT_SCORE) ||
        (b.wins || 0) - (a.wins || 0) ||
        a.name.localeCompare(b.name)
      );

      list.innerHTML = sorted.map((entry, index) => `
        <div class="card">
          <div class="row">
            <div style="display:flex; align-items:center;">
              <div style="font-size:1.35rem; font-weight:900; color:#64748b; min-width:2.5rem;">#${index + 1}</div>
              <div>
                <div class="title">${escapeHtml(entry.name)}${entry.statusLabel ? ` <span class="status-chip ${entry.isActive ? 'ready' : 'warning'}">${escapeHtml(entry.statusLabel)}</span>` : ''}</div>
                <div class="tiny" style="color:#94a3b8; margin-top:0.25rem;">
                  ${leaderboardMode === 'all' ? `${escapeHtml(entry._courtName)} · ` : ''}${escapeHtml(entry.teamLabel)} · W: ${entry.wins || 0} / L: ${entry.losses || 0} / GP: ${entry.gamesPlayed || 0}
                </div>
              </div>
            </div>
            <div style="font-size:1.45rem; font-weight:900; color:#f97316;">${entry.totalScore || DEFAULT_SCORE}</div>
          </div>
        </div>
      `).join('') || `<div class="card center muted" style="font-weight:900;">No leaderboard data available.</div>`;
    }

    function renderTabs() {
      document.getElementById('tab-players').classList.toggle('active', state.activeTab === 'players');
      document.getElementById('tab-schedule').classList.toggle('active', state.activeTab === 'schedule');
      document.getElementById('tab-leaderboard').classList.toggle('active', state.activeTab === 'leaderboard');

      document.getElementById('view-players').classList.toggle('hidden', state.activeTab !== 'players');
      document.getElementById('view-schedule').classList.toggle('hidden', state.activeTab !== 'schedule');
      document.getElementById('view-leaderboard').classList.toggle('hidden', state.activeTab !== 'leaderboard');
    }

    function renderApp() {
      if (!getCourtById(state.activeCourtId)) {
        state.activeCourtId = state.courts[0]?.id;
      }

      renderCourtBar();
      renderCurrentMatch();
      renderPlayersTab();
      renderScheduleTab();
      renderLeaderboardTab();
      renderTabs();
    }

    document.addEventListener('click', event => {
      if (!event.target.closest('.autocomplete')) {
        hideAutocompleteLists();
      }
    });

    window.switchTab = switchTab;
    window.switchCourt = switchCourt;
    window.toggleLeaderboardMode = toggleLeaderboardMode;
    window.updateCourtScoreType = updateCourtScoreType;
    window.updateMatchFormat = updateMatchFormat;
    window.editCourtEventName = editCourtEventName;
    window.editCourtLocation = editCourtLocation;
    window.showPlayerSuggestions = showPlayerSuggestions;
    window.selectMemoryPlayerAndAdd = selectMemoryPlayerAndAdd;
    window.deleteMemoryPlayer = deleteMemoryPlayer;
    window.addPlayer = addPlayer;
    window.editPlayer = editPlayer;
    window.syncFixedTeamCreateOptions = syncFixedTeamCreateOptions;
    window.createFixedTeam = createFixedTeam;
    window.updateFixedTeamMember = updateFixedTeamMember;
    window.removeFixedTeam = removeFixedTeam;
    window.movePlayerToCourt = movePlayerToCourt;
    window.handleDrop = handleDrop;
    window.handleActivate = handleActivate;
    window.removePlayerPermanently = removePlayerPermanently;
    window.submitScoreAction = submitScoreAction;
    window.handleEdit = handleEdit;
    window.exportDUPRCSV = exportDUPRCSV;
    window.clearData = clearData;
    window.addCourt = addCourt;

    state.courts.forEach(court => {
      migrateCourtState(court);
      rebuildCourtScheduling(court);
    });
    updateEventsList();
    saveState();
    renderApp();
  </script>
</body>
</html>
